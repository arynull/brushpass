name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/

  install-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clean install from source
        run: |
          python -m venv /tmp/ci-venv
          /tmp/ci-venv/bin/pip install --quiet .
          /tmp/ci-venv/bin/brushpass --version
      - name: CLI smoke test (mint / verify / revoke)
        run: |
          export BRUSHPASS_DATA_DIR="$(mktemp -d)"
          BP=/tmp/ci-venv/bin/brushpass
          TOKEN_JSON="$($BP mint --scope github:rayanalpha/repo:read --ttl 1h --json)"
          TOKEN="$(python3 -c "import json,sys; print(json.load(sys.stdin)['token'])" <<< "$TOKEN_JSON")"
          TOKEN_ID="$(python3 -c "import json,sys; print(json.load(sys.stdin)['id'])" <<< "$TOKEN_JSON")"
          $BP verify --scope github:rayanalpha/repo:read "$TOKEN"
          # a wider scope must be denied (exit 1)
          if $BP verify --scope github:rayanalpha/repo:write "$TOKEN" >/dev/null 2>&1; then
            echo "scope escalation was not denied"; exit 1
          fi
          $BP revoke "$TOKEN_ID"
          # a revoked token must be denied (exit 1)
          if $BP verify --scope github:rayanalpha/repo:read "$TOKEN" >/dev/null 2>&1; then
            echo "revoked token was not denied"; exit 1
          fi
          $BP audit verify
          echo "smoke OK"
